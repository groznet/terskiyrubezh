<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Восстановление исторической справедливости - Поисковое движение «Терский Рубеж»</title>
        <!-- Tailwind CSS CDN -->
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
		 <script src="/assets/js/tailwind.js"></script>
        <script>
            tailwind.config = {
                theme: {
                    container: {
                        center: true,
                        padding: '16px',
                        screens: {
                            DEFAULT: '1280px'
                        }
                    },
                    extend: {
                        colors: {
                            primary: '#8c1515',
                            secondary: '#f1f0ee',
                            accent: '#00505c'
                        },
                        fontFamily: {
                            heading: ['Montserrat', 'sans-serif'],
                            body: ['Inter', 'sans-serif']
                        }
                    }
                },
                corePlugins: {
                    preflight: true
                }
            }
        </script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    </head>
    <body x-data="{ sidebarOpen: false }" 
      class="bg-white text-gray-900 font-sans antialiased min-h-screen flex flex-col relative"
      style="background-image: url('/assets/images/visuals/old-paper-pattern.jpg'); background-repeat: repeat;">
        <!-- Mobile Backdrop Overlay -->
        <div x-show="sidebarOpen" x-transition:enter="transition-opacity ease-linear duration-100" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition-opacity ease-linear duration-300" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="sidebarOpen = false" class="fixed inset-0 bg-gray-900/50 z-40 md:hidden" style="display: none;"></div>
        <!-- 1. TOP HEADER -->
        {{ partial "header.html" . }}
        <!-- 3. MAIN BODY CONTAINER -->
        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex-grow">
            <div class="flex flex-col md:flex-row gap-8">
                <!-- LEFT SIDEBAR (1/4 width desktop) -->
                {{ partial "sidebar.html" . }}
                <!-- RIGHT CONTENT AREA (3/4 width desktop) -->
                {{ block "main" . }}{{ end }}
            </div>
        </div>
        <!-- FOOTER -->
        {{ partial "footer.html" . }}
        <!-- VANILLA JS FOR MENU & ACCORDIONS -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Mobile Navbar Toggle
                const mobileBtn = document.getElementById('mobile-menu-btn');
                const navLinks = document.getElementById('nav-links');
                if (mobileBtn && navLinks) {
                    mobileBtn.addEventListener('click', () => {
                        const isExpanded = mobileBtn.getAttribute('aria-expanded') === 'true';
                        mobileBtn.setAttribute('aria-expanded', !isExpanded);
                        navLinks.classList.toggle('hidden');
                    });
                }
                // Sidebar Accordion Event Delegation
                document.addEventListener('click', (e) => {
                    const btn = e.target.closest('.accordion-btn');
                    if (!btn) return;
                    const content = btn.nextElementSibling;
                    const icon = btn.querySelector('.icon');
                    if (!content) return;
                    const isExpanded = btn.getAttribute('aria-expanded') === 'true';
                    content.classList.toggle('hidden', isExpanded);
                    btn.setAttribute('aria-expanded', !isExpanded);
                    if (icon) {
                        icon.textContent = isExpanded ? '+' : '—';
                    }
                });
            });
        </script>
    </body>
</html>
