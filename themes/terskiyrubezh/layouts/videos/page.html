{{ define "main" }}

    {{ $videos := index site.Data "videos-updated" }}

    <main class="w-full md:w-3/4">
        <article class="space-y-6">

            <!-- Header Section -->
            <header class="space-y-3">
                <h1 class="text-2xl sm:text-3xl font-bold font-heading text-gray-900 tracking-tight">
                    Видеоматериалы
                </h1>

                <div class="flex items-center gap-x-2 text-sm text-gray-600 font-body">
                    <span class="font-medium text-gray-900">
                        Видеоархив общественного движения «Терский Рубеж»
                    </span>
                </div>
            </header>

            <!-- Videos -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

                {{ range $videos }}

                    <div class="video-card relative w-full aspect-video bg-black rounded-lg overflow-hidden cursor-pointer">
                        <video
                            class="w-full h-full block bg-black"
                            preload="metadata"
                            playsinline
                            title="{{ .title }}">
                            <source src="{{ replace .permanent_url " " "%20" }}" type="video/mp4">
                        </video>
                        <span class="video-play absolute inset-0 flex items-center justify-center pointer-events-none">
                            <span class="flex items-center justify-center w-16 h-16 rounded-full bg-black/60">
                                <svg viewBox="0 0 24 24" class="w-8 h-8 ml-1 text-white" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </span>
                        </span>
                    </div>

                {{ end }}

            </div>

        </article>
    </main>

    <script>
        document.querySelectorAll('.video-card').forEach(function (card) {
            var v = card.querySelector('video');
            var btn = card.querySelector('.video-play');
            card.addEventListener('click', function () {
                if (v.paused) { document.querySelectorAll('.video-card video').forEach(function (o) { if (o !== v) o.pause(); }); v.play(); } else { v.pause(); }
            });
            v.addEventListener('play', function () { btn.style.display = 'none'; });
            v.addEventListener('pause', function () { btn.style.display = ''; });
            v.addEventListener('ended', function () { btn.style.display = ''; });
        });
    </script>

{{ end }}
