{{ define "main" }}

    {{ $partners := site.Data.partners }}

    <main class="w-full md:w-3/4">
        <article class="space-y-6">

            <!-- Header Section -->
            <header class="space-y-3">
                <h1 class="text-2xl sm:text-3xl font-bold font-heading text-gray-900 tracking-tight">
                    Партнёры
                </h1>

                <div class="flex items-center gap-x-2 text-sm text-gray-600 font-body">
                    <span class="font-medium text-gray-900">
                        Партнёры общественного движения «Терский Рубеж»
                    </span>
                </div>
            </header>

            <!-- Partners -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

                {{ range $partners }}

                    <article class="space-y-4">

                        <!-- Logo -->
                        <div class="w-full h-48 bg-gray-200 border border-gray-300 flex items-center justify-center p-6">
                            <img
                                src="{{ .logo }}"
                                alt="{{ .name }}"
                                class="max-w-full max-h-full object-contain block">
                        </div>

                        <!-- Content -->
                        <div class="space-y-2">
                            <h2 class="text-lg font-bold font-heading text-gray-900 leading-snug">
                                {{ .name }}
                            </h2>

                            {{ with .description }}
                                <p class="text-sm text-gray-700 leading-relaxed">
                                    {{ . }}
                                </p>
                            {{ end }}
                        </div>

                    </article>

                {{ end }}

            </div>

        </article>
    </main>

{{ end }}
