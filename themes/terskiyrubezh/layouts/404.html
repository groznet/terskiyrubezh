{{ define "main" }}
<div class="min-h-[60vh] flex flex-col px-4 py-12">
    <!-- 404 Visual Header -->
    <div class="relative mb-6">
        <h1 class="text-8xl md:text-9xl font-heading font-black text-primary/10 select-none">
            404
        </h1>
        <div class="absolute inset-0 flex items-center justify-center">
            <span class="text-2xl md:text-3xl font-heading font-bold text-primary uppercase tracking-widest">
                Страница не найдена
            </span>
        </div>
    </div>

    <!-- Message -->
    <p class="text-text/80 max-w-md mb-8 text-base md:text-lg leading-relaxed">
        Запрашиваемый материал был удален, переименован или временно недоступен. Воспользуйтесь поиском или вернитесь на главную страницу.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center gap-4">
        <a href="{{ "/" | relLangURL }}" 
           class="w-full sm:w-auto px-6 py-3 bg-primary text-white font-medium hover:bg-accent transition-colors duration-200 shadow-sm text-sm uppercase tracking-wider">
            На главную
        </a>
        <a href="{{ "/news/" | relLangURL }}" 
           class="w-full sm:w-auto px-6 py-3 bg-surface border border-gray-300 text-text font-medium hover:border-accent hover:text-accent transition-colors duration-200 text-sm uppercase tracking-wider">
            Все новости
        </a>
    </div>
</div>
{{ end }}
